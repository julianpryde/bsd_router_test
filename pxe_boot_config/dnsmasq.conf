# dnsmasq configuration for PXE boot server
# Copy to /etc/dnsmasq.conf

# Interface to listen on (connected to router's em2)
interface=ens34

# Bind dynamically so dnsmasq can start even if the interface link is down
# and attach when it becomes available.
bind-dynamic

# DHCP range for PXE boot network
# Router will get 192.168.100.2
dhcp-range=192.168.100.2,192.168.100.50,255.255.255.0,12h

# DHCP options for NFS boot
# pxeboot loads via TFTP, then uses NFS (specified in root-path) for kernel
dhcp-option=17,192.168.100.1:/srv/nfs/freebsd  # root-path: NFS mount for kernel/files

# Enable TFTP server (only for initial pxeboot)
enable-tftp
tftp-root=/srv/tftp

# PXE boot settings (BIOS only)
# pxeboot loads via TFTP, subsequent files load via NFS
dhcp-boot=pxeboot,pxeserver,192.168.100.1

# Log DHCP activity for debugging
log-dhcp

# Don't read /etc/resolv.conf or /etc/hosts
no-resolv
no-hosts

# Disable DNS server functionality (we're only DHCP/TFTP)
port=0
