# dnsmasq configuration for PXE boot server
# Copy to /etc/dnsmasq.conf

# Interface to listen on (connected to router's em2)
interface=ens34

# Do not bind to wildcard address
bind-interfaces

# DHCP range for PXE boot network
# Router will get 192.168.100.2
dhcp-range=192.168.100.2,192.168.100.50,255.255.255.0,12h

# DHCP options
dhcp-option=3  # No default gateway (isolated boot network)
dhcp-option=6  # No DNS server needed for boot

# Enable TFTP server
enable-tftp
tftp-root=/srv/tftp

# PXE boot settings (BIOS only)
dhcp-boot=pxelinux.0

# Log DHCP activity for debugging
log-dhcp

# Don't read /etc/resolv.conf or /etc/hosts
no-resolv
no-hosts

# Don't forward DNS queries (we're not a DNS server)
port=0
