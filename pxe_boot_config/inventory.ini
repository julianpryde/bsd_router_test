# Ansible Inventory for QEMU Testing Environment
# This inventory is used to configure the Pi QEMU emulator (PXE server)
# via Ansible playbook: pxe_boot_config/playbook.yml
#
# For physical deployment, create a separate inventory file pointing to your actual Pi

[pxe_server]
127.0.0.1 ansible_port=2222 ansible_user=root ansible_ssh_private_key_file=./testing_key

[pxe_server:vars]
# Variables for the playbook
ansible_host_key_checking=False
remote_server_ip=127.0.0.1
