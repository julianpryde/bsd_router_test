---
- name: Setup Debian PXE Boot Server for FreeBSD
  hosts: pxe_server
  become: true
  vars:
    remote_ip: "{{ remote_server_ip }}"
    tftp_root: /srv/tftp
    nfs_root: /srv/nfs/freebsd
    pxe_network: 192.168.100.0/24

  tasks:
    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "Remote server IP: {{ remote_ip }}"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - dnsmasq
          - nfs-kernel-server
          - xz-utils
          - libarchive-tools
        state: present

    - name: Check if network interfaces configuration exists
      ansible.builtin.stat:
        path: /etc/network/interfaces.d/pxe-boot
      register: pxe_boot_config

    - name: Backup existing network interfaces configuration
      ansible.builtin.copy:
        src: /etc/network/interfaces.d/pxe-boot
        dest: "/etc/network/interfaces.d/pxe-boot.bak"
        remote_src: true
        mode: preserve
      when: pxe_boot_config.stat.exists

    - name: Check if dnsmasq configuration exists
      ansible.builtin.stat:
        path: /etc/dnsmasq.conf
      register: dnsmasq_conf

    - name: Backup existing dnsmasq configuration
      ansible.builtin.copy:
        src: /etc/dnsmasq.conf
        dest: "/etc/dnsmasq.conf.bak"
        remote_src: true
        mode: preserve
      when: dnsmasq_conf.stat.exists

    - name: Copy network interfaces configuration
      ansible.builtin.copy:
        src: interfaces
        dest: /etc/network/interfaces.d/pxe-boot
        mode: '0644'
      notify: restart networking

    - name: Copy dnsmasq configuration
      ansible.builtin.copy:
        src: dnsmasq.conf
        dest: /etc/dnsmasq.conf
        mode: '0644'
      notify: restart dnsmasq

    - name: Clean TFTP directory
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: absent

    - name: Create TFTP directory
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: directory
        mode: '0755'

    - name: Create NFS directory
      ansible.builtin.file:
        path: "{{ nfs_root }}"
        state: directory
        mode: '0755'

    - name: Create release storage directory
      ansible.builtin.file:
        path: /root/freebsd-release
        state: directory
        mode: '0755'

    - name: Check extracted release marker
      ansible.builtin.stat:
        path: "{{ nfs_root }}/.extracted_release"
      register: extracted_release_marker

    - name: Download FreeBSD base.txz
      ansible.builtin.get_url:
        url: "http://{{ remote_ip }}:8080/base.txz"
        dest: "/root/freebsd-release/base.txz"
        timeout: 300
        mode: '0644'
      when: not extracted_release_marker.stat.exists

    - name: Download FreeBSD kernel.txz
      ansible.builtin.get_url:
        url: "http://{{ remote_ip }}:8080/kernel.txz"
        dest: "/root/freebsd-release/kernel.txz"
        timeout: 300
        mode: '0644'
      when: not extracted_release_marker.stat.exists

    - name: Clean NFS directory for re-extraction
      ansible.builtin.file:
        path: "{{ nfs_root }}"
        state: absent
      when: not extracted_release_marker.stat.exists

    - name: Recreate NFS directory
      ansible.builtin.file:
        path: "{{ nfs_root }}"
        state: directory
        mode: '0755'
      when: not extracted_release_marker.stat.exists

    - name: Extract base.txz to NFS root
      ansible.builtin.unarchive:
        src: "/root/freebsd-release/base.txz"
        dest: "{{ nfs_root }}"
        remote_src: true
        creates: "{{ nfs_root }}/bin/sh"
      when: not extracted_release_marker.stat.exists

    - name: Extract kernel.txz to NFS root
      ansible.builtin.unarchive:
        src: "/root/freebsd-release/kernel.txz"
        dest: "{{ nfs_root }}"
        remote_src: true
        creates: "{{ nfs_root }}/boot/kernel/kernel"
      when: not extracted_release_marker.stat.exists

    - name: Create extracted release marker
      ansible.builtin.copy:
        content: "base and kernel extracted"
        dest: "{{ nfs_root }}/.extracted_release"
        mode: '0644'
      when: not extracted_release_marker.stat.exists

    - name: Create empty fstab to prevent mount errors
      ansible.builtin.copy:
        content: "# Custom fstab for diskless boot\n"
        dest: "{{ nfs_root }}/etc/fstab"
        mode: '0644'
        force: false

    - name: Create first-boot package installation script
      ansible.builtin.copy:
        dest: "{{ nfs_root }}/etc/rc.local"
        mode: '0755'
        content: |
          #!/bin/sh
          # Run package installation on first boot
          if [ ! -f /var/.packages_installed ]; then
              echo "========================================"
              echo "First boot: Installing packages..."
              echo "========================================"

              # Bootstrap and install packages
              pkg bootstrap -y
              pkg install -y dnsmasq ca_root_nss

              # Create dnscrypt-proxy user
              pw useradd _dnscrypt-proxy -d /nonexistent -s /usr/sbin/nologin -c 'dnscrypt-proxy user' 2>/dev/null || true

              # Mark as complete
              touch /var/.packages_installed

              echo "========================================"
              echo "Package installation complete!"
              echo "Starting services..."
              echo "========================================"

              # Start services now that packages are installed
              service dnsmasq start
              service dnscrypt_proxy start

              echo "First boot setup complete"
          fi

    - name: Download dnscrypt-proxy
      ansible.builtin.get_url:
        url: "https://github.com/DNSCrypt/dnscrypt-proxy/releases/download/2.1.15/dnscrypt-proxy-freebsd_amd64-2.1.15.tar.gz"
        dest: "/tmp/dnscrypt-proxy.tar.gz"
        mode: '0644'

    - name: Extract dnscrypt-proxy
      ansible.builtin.unarchive:
        src: "/tmp/dnscrypt-proxy.tar.gz"
        dest: "/tmp"
        remote_src: true
        creates: "/tmp/freebsd-amd64/dnscrypt-proxy"

    - name: Create /usr/local/sbin directory
      ansible.builtin.file:
        path: "{{ nfs_root }}/usr/local/sbin"
        state: directory
        mode: '0755'
        owner: "0"
        group: "0"

    - name: Install dnscrypt-proxy binary
      ansible.builtin.copy:
        src: "/tmp/freebsd-amd64/dnscrypt-proxy"
        dest: "{{ nfs_root }}/usr/local/sbin/dnscrypt-proxy"
        mode: '0755'
        remote_src: true

    - name: Create dnscrypt-proxy directories
      ansible.builtin.file:
        path: "{{ nfs_root }}/{{ item }}"
        state: directory
        mode: '0750'
        owner: "0"
        group: "0"
      loop:
        - usr/local/etc
        - usr/local/etc/rc.d
        - usr/local/etc/dnscrypt-proxy
        - var/log/dnscrypt-proxy
        - var/cache/dnscrypt-proxy

    - name: Copy router configuration files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../router_config/{{ item.src }}"
        dest: "{{ nfs_root }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: 'rc.conf', dest: 'etc/rc.conf', mode: '0644' }
        - { src: 'pf.conf', dest: 'etc/pf.conf', mode: '0644' }
        - { src: 'dnsmasq.conf', dest: 'usr/local/etc/dnsmasq.conf', mode: '0644' }
        - { src: 'dnscrypt-proxy', dest: 'usr/local/etc/rc.d/dnscrypt_proxy', mode: '0755' }
        - { src: 'dnscrypt-proxy.toml', dest: 'usr/local/etc/dnscrypt-proxy/dnscrypt-proxy.toml', mode: '0640' }
        - { src: 'blocklist.txt', dest: 'usr/local/etc/dnscrypt-proxy/blocklist.txt', mode: '0640' }
        - { src: 'update_blocklists.sh', dest: 'usr/local/sbin/update_blocklists.sh', mode: '0755' }

    - name: Download dnscrypt-proxy resolver list
      ansible.builtin.get_url:
        url: "https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md"
        dest: "{{ nfs_root }}/var/cache/dnscrypt-proxy/public-resolvers.md"
        mode: '0644'

    - name: Download dnscrypt-proxy resolver list signature
      ansible.builtin.get_url:
        url: "https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md.minisig"
        dest: "{{ nfs_root }}/var/cache/dnscrypt-proxy/public-resolvers.md.minisig"
        mode: '0644'

    - name: Verify pxeboot exists
      ansible.builtin.stat:
        path: "{{ nfs_root }}/boot/pxeboot"
      register: pxeboot_stat
      failed_when: not pxeboot_stat.stat.exists

    - name: Copy pxeboot to TFTP directory
      ansible.builtin.copy:
        src: "{{ nfs_root }}/boot/pxeboot"
        dest: "{{ tftp_root }}/pxeboot"
        remote_src: true
        mode: '0755'
        owner: root
        group: root

    - name: Verify kernel exists
      ansible.builtin.stat:
        path: "{{ nfs_root }}/boot/kernel/kernel"
      register: kernel_stat
      failed_when: not kernel_stat.stat.exists

    - name: Copy custom loader.conf
      ansible.builtin.copy:
        src: loader.conf
        dest: "{{ nfs_root }}/boot/loader.conf"
        mode: '0644'

    - name: Check if NFS configuration exists
      ansible.builtin.stat:
        path: /etc/nfs.conf
      register: nfs_conf

    - name: Backup NFS configuration
      ansible.builtin.copy:
        src: /etc/nfs.conf
        dest: "/etc/nfs.conf.bak"
        remote_src: true
        mode: preserve
      when: nfs_conf.stat.exists

    - name: Configure NFS for UDP and NFSv3
      ansible.builtin.copy:
        content: |
          [general]
          pipefs-directory=/run/rpc_pipefs

          [mountd]
          manage-gids=y
          udp=y

          [nfsd]
          udp=y
          vers3=y
        dest: /etc/nfs.conf
        mode: '0644'
      notify: Restart nfs server

    - name: Check if nfs-kernel-server defaults exists
      ansible.builtin.stat:
        path: /etc/default/nfs-kernel-server
      register: nfs_defaults

    - name: Backup nfs-kernel-server defaults
      ansible.builtin.copy:
        src: /etc/default/nfs-kernel-server
        dest: "/etc/default/nfs-kernel-server.bak"
        remote_src: true
        mode: preserve
      when: nfs_defaults.stat.exists

    - name: Configure RPCMOUNTD options
      ansible.builtin.lineinfile:
        path: /etc/default/nfs-kernel-server
        line: 'RPCMOUNTDOPTS="--no-tcp"'
        regexp: '^RPCMOUNTDOPTS='
        state: present
        create: true
        mode: '0644'
      notify: Restart nfs server

    - name: Configure NFS export
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "{{ nfs_root }} {{ pxe_network }}(rw,sync,no_subtree_check)"
        state: present
        create: true
        mode: '0644'
      notify:
        - Reload exports
        - Restart nfs server

    - name: Set TFTP directory permissions
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: directory
        mode: '0755'

    - name: Ensure NFS root is accessible
      ansible.builtin.file:
        path: "{{ nfs_root }}"
        state: directory
        mode: '0755'
        recurse: true

    - name: Enable services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - dnsmasq
        - nfs-kernel-server

  handlers:
    - name: Restart networking
      ansible.builtin.systemd:
        name: networking
        state: restarted

    - name: Restart dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted

    - name: Reload exports
      ansible.builtin.command:
        cmd: exportfs -ra
      changed_when: false

    - name: Restart nfs server
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: restarted

- name: Verify PXE Boot Setup
  hosts: pxe_server
  become: true
  vars:
    tftp_root: /srv/tftp
    nfs_root: /srv/nfs/freebsd

  tasks:
    - name: List TFTP files
      ansible.builtin.command:
        cmd: ls -lh {{ tftp_root }}/
      register: tftp_files
      changed_when: false

    - name: Display TFTP files
      ansible.builtin.debug:
        msg: "{{ tftp_files.stdout_lines }}"

    - name: Show NFS exports
      ansible.builtin.command:
        cmd: showmount -e localhost
      register: nfs_exports
      changed_when: false

    - name: Display NFS exports
      ansible.builtin.debug:
        msg: "{{ nfs_exports.stdout_lines }}"

    - name: Verify required files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: file_check
      failed_when: not file_check.stat.exists
      loop:
        - "{{ tftp_root }}/pxeboot"
        - "{{ nfs_root }}/boot/loader.conf"
        - "{{ nfs_root }}/boot/kernel/kernel"

    - name: Display success message
      ansible.builtin.debug:
        msg:
          - "✓ PXE Boot Setup Complete!"
          - "✓ All required files are in place:"
          - "  - /srv/tftp/pxeboot (loaded via TFTP)"
          - "  - /srv/nfs/freebsd/boot/loader.conf (accessed via NFS)"
          - "  - /srv/nfs/freebsd/boot/kernel/kernel (accessed via NFS)"
          - ""
          - "Boot sequence:"
          - "  1. pxeboot loads via TFTP"
          - "  2. pxeboot mounts NFS from /srv/nfs/freebsd"
          - "  3. Kernel loads from NFS mount"
          - "  4. Kernel boots with NFS root filesystem (diskless)"
          - ""
          - "Network Configuration:"
          - "  This server: 192.168.100.1"
          - "  Router (em2): 192.168.100.2"
