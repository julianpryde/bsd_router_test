# FreeBSD PXE Boot Loader Configuration
# Boot from the installed ZFS root on da0p3

# Kernel to load (relative to TFTP root)
kernel="kernel"

# Boot from ZFS root on local disk
vfs.root.mountfrom="zfs:zroot/ROOT/default"

# Autoboot after timeout (in seconds)
autoboot_delay="3"

# Boot verbosity for debugging
boot_verbose="YES"

# Disable logo to speed up boot
beastie_disable="YES"
