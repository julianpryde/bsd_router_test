# FreeBSD Boot Loader Configuration
# This is read by /boot/loader (the FreeBSD bootloader)
# Copy to /srv/tftp/loader.conf

# Kernel to load
kernel="kernel"

# Autoboot after timeout (in seconds)
autoboot_delay="3"

# Optional: Load kernel symbols for debugging
# kernel_symbols="kernel.symbols"

# Optional: Set boot verbosity
# boot_verbose="YES"
