# FreeBSD PXE Boot Loader Configuration
# Boot from NFS root (diskless)

# Kernel to load (relative to TFTP root)
kernel="kernel"

# Boot from NFS root on the PXE/NFS server
vfs.root.mountfrom="nfs:192.168.100.1:/srv/nfs/freebsd"
vfs.root.mountfrom.options="rw"

# Autoboot after timeout (in seconds)
autoboot_delay="3"

# Boot verbosity for debugging
boot_verbose="YES"

# Disable logo to speed up boot
beastie_disable="YES"
