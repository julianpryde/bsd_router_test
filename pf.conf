# --- Macros ---
wan_if = "em0"
lan_if = "em1"
mgmt_if = "em2"
pi_ip = "192.168.100.1"
nat64_if = "tun0"
nat64_pool = "192.168.255.0/24"

# ICMPv6 types required for healthy IPv6 operation
# neighbrsol/adv = "Who has this IP?"
# routeradv/sol  = "Where is the router?"
icmp6_types = "{ neighbrsol, neighbradv, routeradv, routersol, echoreq }"

# --- Options ---
# Ignore TAYGA interface
set skip on $nat64_if
set skip on lo0
set block-policy drop

# --- NAT64 ---
# Nat the Tayga IPv4 pool to the WAN interface address
nat on $wan_if from $nat64_pool to any -> ($wan_if)

# --- Filter Rules ---

# 1. Default Deny
block all

# 2. Physical Management Plane (em2)
# Only talk to the Pi. No other traffic allowed.
pass in quick on $mgmt_if from $pi_ip to self
pass out quick on $mgmt_if from self to $pi_ip

# 3. LAN Interface (em1) - IPv6 Services
# Allow ICMPv6 (Essential for finding neighbors and the gateway)
pass in quick on $lan_if inet6 proto icmp6 icmp6-type $icmp6_types
pass out quick on $lan_if inet6 proto icmp6 icmp6-type $icmp6_types

# Allow DNS (Port 53) from LAN to Router
pass in quick on $lan_if inet6 proto { tcp udp } from ($lan_if:network) to self port 53

# Allow DHCPv6 (Ports 546/547)
# Note: Clients send to the All_DHCP_Relay_Agents_and_Servers multicast address (ff02::1:2)
pass in quick on $lan_if inet6 proto udp from any to { self, ff02::1:2 } port 547
pass out quick on $lan_if inet6 proto udp from self to any port 546

# 4. Outbound Internet Access
# Allow the router itself to access the internet
pass out on $wan_if from ($wan_if) to any

# Allow NAT64 translated traffic
pass out quick on $wan_if from $nat64_pool to any

# Allow LAN clients to reach the WAN (IPv6 Forwarding)
pass in on $lan_if inet6 from $lan_if:network to any
pass out on $wan_if inet6 from any to any