##
## dnscrypt-proxy 2 - DoH DNS proxy with Pi-hole blocklists
##

# Server listening address - localhost only (redirected by pf)
listen_addresses = ["127.0.0.1:5353"]

# Upstream DNS servers - use Cloudflare's public resolvers
server_names = ["cloudflare", "cloudflare-ipv6"]

# Timeout for upstream queries (milliseconds)
timeout = 5000
keepalive = 30

# Use servers reachable over IPv4
ipv4_servers = true

# Use servers reachable over IPv6
ipv6_servers = false

# Use servers implementing the DNSCrypt protocol
dnscrypt_servers = true

# Use servers implementing the DNS-over-HTTPS protocol
doh_servers = true

# Cache results
cache = true
cache_min_ttl = 10
cache_max_ttl = 86400
cache_size = 4096

# Ignore system resolv.conf
ignore_system_dns = true

##
## Sources - Download public resolver lists
##

[sources]

  [sources.'public-resolvers']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md', 'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md']
  cache_file = 'public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 72

##
## Domain Blocklists (Pi-hole compatible)
##

[blocked_names]
  # Load blocklist from file (convert from hosts format)
  blocked_names_file = "/usr/local/etc/dnscrypt-proxy/blocklist.txt"

##
## Query Logging
##

[query_log]
  file = "/var/log/dnscrypt-proxy/query.log"
  format = "tsv"
