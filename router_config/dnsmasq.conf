# --- Network Interface Settings ---
interface=em1          # LAN interface
interface=vlan10       # Xbox VLAN
interface=vlan11       # Hue/IoT VLAN
except-interface=em0   # Ignore WAN
except-interface=em2   # Ignore the Pi/Management link (Critical for isolation)
bind-interfaces        # Bind only to the interfaces specified

# --- DNS Settings ---
domain-needed          # Don't forward plain names (e.g., "laptop")
bogus-priv             # Don't forward private reverse lookups
local=/home.local/     # Our local domain
domain=home.local
expand-hosts           # Add domain to simple hostnames in /etc/hosts
no-resolv              # Ignore /etc/resolv.conf on the router
server=127.0.0.1#5353  # Forward to dnscrypt-proxy2 (DoH resolver)
filter-AAAA            # Suppress IPv6 (AAAA) records to prefer IPv4

# --- DHCPv4 Settings ---

# Main LAN DHCP Range
dhcp-range=192.168.1.100,192.168.1.254,12h

# DHCP Reservations for iPhones (Main LAN)
dhcp-host=FF:FF:FF:FF:FF:01,iphone1,192.168.1.10,12h
dhcp-host=FF:FF:FF:FF:FF:02,iphone2,192.168.1.11,12h

# Hue Bridge (Hue VLAN)
dhcp-host=FF:FF:FF:FF:FF:10,hue-bridge,192.168.11.50,12h

# Xbox (Xbox VLAN)
dhcp-host=FF:FF:FF:FF:FF:20,xbox,192.168.10.50,12h

# Xbox VLAN DHCP Range
dhcp-range=interface:vlan10,192.168.10.100,192.168.10.254,12h
# Set gateway (router) for Xbox VLAN DHCPv4 clients
dhcp-option=tag:vlan10,option:router,192.168.10.1
# Set DNS server for Xbox VLAN DHCPv4 clients (the router itself)
dhcp-option=tag:vlan10,option:dns-server,192.168.10.1

# Hue VLAN DHCP Range
dhcp-range=interface:vlan11,192.168.11.100,192.168.11.254,12h
# Set gateway (router) for Hue VLAN DHCPv4 clients
dhcp-option=tag:vlan11,option:router,192.168.11.1
# Set DNS server for Hue VLAN DHCPv4 clients (the router itself)
dhcp-option=tag:vlan11,option:dns-server,192.168.11.1

# Set gateway (router) for DHCPv4 clients (Main LAN)
dhcp-option=option:router,192.168.1.1

# Set DNS server for DHCPv4 clients (the router itself)
dhcp-option=option:dns-server,192.168.1.1

# --- IPv6 Router Advertisements ---
enable-ra              # Enable IPv6 Router Advertisements (for SLAAC)

# IPv6 SLAAC with stateless address configuration for Main LAN
dhcp-range=::,constructor:em1,ra-stateless,12h

# IPv6 SLAAC for Xbox VLAN
dhcp-range=::,constructor:vlan10,ra-stateless,12h

# IPv6 SLAAC for Hue VLAN
dhcp-range=::,constructor:vlan11,ra-stateless,12h
