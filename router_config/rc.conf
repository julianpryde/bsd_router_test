clear_tmp_enable="YES"
syslogd_flags="-ss"
hostname="routertest"
ifconfig_em0="DHCP"
ifconfig_em0_ipv6="inet6 accept_rtadv"
ifconfig_em1="inet 192.168.1.1 netmask 255.255.255.0"
ifconfig_em1_ipv6="inet6 2001:db8:1::1 prefixlen 64"
ifconfig_em2="inet 192.168.100.2 netmask 255.255.255.0"

# VLAN Configuration for Xbox and Hue/IoT isolation
cloned_interfaces="vlan10 vlan11"
ifconfig_vlan10="inet 192.168.10.1 netmask 255.255.255.0 vlan 10 vlandev em1"
ifconfig_vlan10_ipv6="inet6 2001:db8:10::1 prefixlen 64"
ifconfig_vlan11="inet 192.168.11.1 netmask 255.255.255.0 vlan 11 vlandev em1"
ifconfig_vlan11_ipv6="inet6 2001:db8:11::1 prefixlen 64"

interface_wait="em0 em1 em2 vlan10 vlan11"

# Set dumpdev to "AUTO" to enable crash dumps, "NO" to disable
dumpdev="AUTO"

zfs_enable="YES"
moused_nondefault_enable="NO"

# Enable routing
ipv6_gateway_enable="YES"
gateway_enable="YES"

# services
sshd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"

## pf and pflog
pf_enable="YES"
pflog_enable="YES"

## dnsmasq
dnsmasq_enable="YES"

## dnscrypt-proxy2 (DoH resolver with blocklists)
dnscrypt_proxy_enable="YES"
dnscrypt_proxy_config="/usr/local/etc/dnscrypt-proxy/dnscrypt-proxy.toml"

## BIND9 removed - replaced with dnscrypt-proxy2
named_enable="NO"

## Zeek Network Security Monitor (JA4 TLS fingerprinting)
zeek_enable="YES"
