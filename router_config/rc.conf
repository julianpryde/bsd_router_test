clear_tmp_enable="YES"
syslogd_flags="-ss"
hostname="routertest"
ifconfig_em0="DHCP"
ifconfig_em0_ipv6="inet6 accept_rtadv"
ifconfig_em1="inet 192.168.1.1 netmask 255.255.255.0"
ifconfig_em1_ipv6="inet6 2001:db8:1::1 prefixlen 64"
ifconfig_em2="inet 192.168.100.2 netmask 255.255.255.0"
interface_wait="em1 em2"

# Set dumpdev to "AUTO" to enable crash dumps, "NO" to disable
dumpdev="AUTO"

zfs_enable="YES"
moused_nondefault_enable="NO"

# Enable routing
ipv6_gateway_enable="YES"
gateway_enable="YES"

# services
sshd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"

## pf and pflog
pf_enable="YES"
pflog_enable="YES"

## dnsmasq
dnsmasq_enable="YES"

named_enable="YES"
named_conf="/usr/local/etc/namedb/named.conf"
