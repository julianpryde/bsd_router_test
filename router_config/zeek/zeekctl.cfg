# ZeekControl configuration – BSD router
#
# Paths follow the FreeBSD pkg install layout for the 'zeek' package.

# Rotate logs every hour (3600 seconds).
LogRotationInterval = 3600

# Keep logs indefinitely (0 = no expiry); adjust to purge old logs.
LogExpireInterval = 0

# Enable the periodic stats log (stats.log).
StatsLogEnable = 1
StatsLogExpireInterval = 7

# Show all nodes in 'zeekctl status', even idle ones.
StatusCmdShowAll = 0

# Keep crash reports for 0 days (crashes are rare on a router).
CrashExpireInterval = 0

# Site-local policy loaded on every node.
SitePolicyScripts = local.zeek

# Log output directory (must be writable by the zeek user).
LogDir = /var/log/zeek

# Spool directory for in-flight log data and process state.
SpoolDir = /var/spool/zeek

# ZeekControl looks here for node.cfg and zeekctl.cfg.
CfgDir = /usr/local/etc/zeek
