# --- Macros ---
wan_if = "em0"
lan_if = "em1"
mgmt_if = "em2"
pi_ip = "192.168.100.1"
lan_net = "192.168.1.0/24"
lan_net6 = "2001:db8:1::/64"

# ICMP types for healthy operation
icmp_types = "{ echoreq, unreach }"

# ICMPv6 types required for healthy IPv6 operation
# neighbrsol/adv = "Who has this IP?"
# routeradv/sol  = "Where is the router?"
icmp6_types = "{ neighbrsol, neighbradv, routeradv, routersol, echoreq }"

# --- Options ---
set skip on lo0
set block-policy drop

# --- NAT for IPv4 LAN traffic ---
# NAT the LAN IPv4 subnet to the WAN interface address
nat on $wan_if from $lan_net to any -> ($wan_if)

# --- Filter Rules ---

# 1. Default Deny
block all

# 2. Physical Management Plane (em2)
# Only talk to the Pi. No other traffic allowed.
pass in quick on $mgmt_if from $pi_ip to self
pass out quick on $mgmt_if from self to $pi_ip

# 3. LAN Interface (em1) - Dual Stack Services

# Allow ICMP (IPv4) for ping and path MTU discovery
pass in quick on $lan_if inet proto icmp icmp-type $icmp_types
pass out quick on $lan_if inet proto icmp icmp-type $icmp_types

# Allow ICMPv6 (Essential for finding neighbors and the gateway)
pass in quick on $lan_if inet6 proto icmp6 icmp6-type $icmp6_types
pass out quick on $lan_if inet6 proto icmp6 icmp6-type $icmp6_types

# Allow DNS (Port 53) from LAN to Router - both IPv4 and IPv6
pass in quick on $lan_if inet proto { tcp udp } from $lan_net to self port 53
pass in quick on $lan_if inet6 proto { tcp udp } from $lan_net6 to self port 53

# Allow DHCPv4 (Ports 67/68)
pass in quick on $lan_if inet proto udp from any port 68 to any port 67
pass out quick on $lan_if inet proto udp from any port 67 to any port 68

# 4. Outbound Internet Access - Dual Stack
# Allow the router itself to access the internet (both protocols)
pass out on $wan_if from ($wan_if) to any

# Allow LAN clients to reach the WAN (IPv4 with NAT)
pass in on $lan_if inet from $lan_net to any
pass out on $wan_if inet from $lan_net to any

# Allow LAN clients to reach the WAN (IPv6 Forwarding - no NAT)
pass in on $lan_if inet6 from $lan_net6 to any
pass out on $wan_if inet6 from any to any