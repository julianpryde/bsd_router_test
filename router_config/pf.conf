# --- Macros ---
wan_if = "em0"
lan_if = "em1"
mgmt_if = "em2"
xbox_vlan = "vlan10"
hue_vlan = "vlan11"

pi_ip = "192.168.100.1"
lan_net = "192.168.1.0/24"
lan_net6 = "2001:db8:1::/64"

xbox_net = "192.168.10.0/24"
xbox_net6 = "2001:db8:10::/64"
xbox_ip = "192.168.10.50"

hue_net = "192.168.11.0/24"
hue_net6 = "2001:db8:11::/64"
hue_bridge_ip = "192.168.11.50"

iphone_net = "192.168.1.0/24"
iphone_net6 = "2001:db8:1::/64"

# Xbox gaming ports
xbox_ports = "{ 3074, 3078, 3079 }"
xbox_outbound_ports = "{ 80, 443, 3074, 3078, 3079, 123 }"

# ICMP types for healthy operation
icmp_types = "{ echoreq, unreach }"

# ICMPv6 types required for healthy IPv6 operation
# neighbrsol/adv = "Who has this IP?"
# routeradv/sol  = "Where is the router?"
icmp6_types = "{ neighbrsol, neighbradv, routeradv, routersol, echoreq }"

# --- Options ---
set skip on lo0
set block-policy drop

# --- NAT for IPv4 LAN traffic ---
# NAT the LAN IPv4 subnet to the WAN interface address
nat on $wan_if from $lan_net to any -> ($wan_if)

# NAT Xbox VLAN IPv4 traffic to WAN
nat on $wan_if from $xbox_net to any -> ($wan_if)

# NAT Hue VLAN IPv4 traffic to WAN
nat on $wan_if from $hue_net to any -> ($wan_if)

# DNS redirection (transparent proxy for dnscrypt-proxy2)
rdr pass on $xbox_vlan inet proto { tcp udp } from $xbox_net to any port 53 -> 127.0.0.1 port 5353
rdr pass on $hue_vlan inet proto { tcp udp } from $hue_net to any port 53 -> 127.0.0.1 port 5353

# --- Filter Rules ---

# 1. Default Deny
block all

# 2. Physical Management Plane (em2)
# Only talk to the Pi. No other traffic allowed.
pass in quick on $mgmt_if from $pi_ip to self
pass out quick on $mgmt_if from self to $pi_ip

# 3. LAN Interface (em1) - Dual Stack Services

# Allow ICMP (IPv4) for ping and path MTU discovery
pass in quick on $lan_if inet proto icmp icmp-type $icmp_types
pass out quick on $lan_if inet proto icmp icmp-type $icmp_types

# Allow ICMPv6 (Essential for finding neighbors and the gateway)
pass in quick on $lan_if inet6 proto icmp6 icmp6-type $icmp6_types
pass out quick on $lan_if inet6 proto icmp6 icmp6-type $icmp6_types

# Allow DNS (Port 53) from LAN to Router - both IPv4 and IPv6
pass in quick on $lan_if inet proto { tcp udp } from $lan_net to self port 53
pass in quick on $lan_if inet6 proto { tcp udp } from $lan_net6 to self port 53

# Allow DHCPv4 (Ports 67/68)
pass in quick on $lan_if inet proto udp from any port 68 to any port 67
pass out quick on $lan_if inet proto udp from any port 67 to any port 68

# 4. Xbox VLAN (vlan10) - Restricted Access

# Allow ICMP for diagnostics
pass in quick on $xbox_vlan inet proto icmp icmp-type $icmp_types
pass out quick on $xbox_vlan inet proto icmp icmp-type $icmp_types

# Allow ICMPv6
pass in quick on $xbox_vlan inet6 proto icmp6 icmp6-type $icmp6_types
pass out quick on $xbox_vlan inet6 proto icmp6 icmp6-type $icmp6_types

# Allow DNS (Port 53) from Xbox VLAN to Router
pass in quick on $xbox_vlan inet proto { tcp udp } from $xbox_net to self port 53
pass in quick on $xbox_vlan inet6 proto { tcp udp } from $xbox_net6 to self port 53

# Allow DHCPv4 for Xbox VLAN
pass in quick on $xbox_vlan inet proto udp from any port 68 to any port 67
pass out quick on $xbox_vlan inet proto udp from any port 67 to any port 68

# Xbox outbound: HTTPS, gaming ports (3074 TCP/UDP, 3078-3079 UDP), NTP (123 UDP)
# HTTPS for downloads/updates
pass in quick on $xbox_vlan inet proto tcp from $xbox_ip to any port 443 keep state

# Xbox Live gaming with stateful tracking
pass in quick on $xbox_vlan inet proto tcp from $xbox_ip to any port 3074 keep state
pass in quick on $xbox_vlan inet proto udp from $xbox_ip to any port 3074 keep state

# Xbox multiplayer UDP ports
pass in quick on $xbox_vlan inet proto udp from $xbox_ip to any port 3078 keep state
pass in quick on $xbox_vlan inet proto udp from $xbox_ip to any port 3079 keep state

# NTP for time sync
pass in quick on $xbox_vlan inet proto udp from $xbox_ip to any port 123 keep state

# Block direct DoT from Xbox VLAN (DoH over 443 is allowed)
block drop out quick on $wan_if inet proto tcp from $xbox_net to any port 853
block drop out quick on $wan_if inet proto udp from $xbox_net to any port 853

# Block Xbox → LAN (isolation)
block drop in quick on $lan_if from $xbox_net
block drop in quick on $lan_if from $xbox_net6

# Block Xbox → Hue VLAN (isolation)
block drop in quick on $hue_vlan from $xbox_net
block drop in quick on $hue_vlan from $xbox_net6

# Block Xbox → mgmt (isolation)
block drop in quick on $mgmt_if from $xbox_net
block drop in quick on $mgmt_if from $xbox_net6

# 5. Hue VLAN (vlan11) - IoT/Smart Home Devices

# Allow ICMP for diagnostics
pass in quick on $hue_vlan inet proto icmp icmp-type $icmp_types
pass out quick on $hue_vlan inet proto icmp icmp-type $icmp_types

# Allow ICMPv6
pass in quick on $hue_vlan inet6 proto icmp6 icmp6-type $icmp6_types
pass out quick on $hue_vlan inet6 proto icmp6 icmp6-type $icmp6_types

# Allow DNS (Port 53) from Hue VLAN to Router
pass in quick on $hue_vlan inet proto { tcp udp } from $hue_net to self port 53
pass in quick on $hue_vlan inet6 proto { tcp udp } from $hue_net6 to self port 53

# Allow DHCPv4 for Hue VLAN
pass in quick on $hue_vlan inet proto udp from any port 68 to any port 67
pass out quick on $hue_vlan inet proto udp from any port 67 to any port 68

# Hue bulbs may need outbound HTTPS for updates/cloud connectivity
pass in quick on $hue_vlan inet proto tcp from $hue_net to any port 443 keep state

# Block direct DoT from Hue VLAN (DoH over 443 is allowed)
block drop out quick on $wan_if inet proto tcp from $hue_net to any port 853
block drop out quick on $wan_if inet proto udp from $hue_net to any port 853

# Block Hue → LAN (isolation)
block drop in quick on $lan_if from $hue_net
block drop in quick on $lan_if from $hue_net6

# Block Hue → Xbox VLAN (isolation)
block drop in quick on $xbox_vlan from $hue_net
block drop in quick on $xbox_vlan from $hue_net6

# Block Hue → mgmt (isolation)
block drop in quick on $mgmt_if from $hue_net
block drop in quick on $mgmt_if from $hue_net6

# 6. Cross-VLAN Access: iPhone → WiZ Bulb Control

# WiZ local control uses UDP 38899 (unicast and broadcast) for discovery/control
pass in quick on $lan_if inet proto udp from $iphone_net to $hue_net port 38899 keep state
pass out quick on $hue_vlan inet proto udp from $hue_net to $iphone_net port 38899 keep state

# Optional: mDNS for service discovery
pass in quick on $lan_if inet proto udp from $iphone_net to $hue_net port 5353 keep state
pass out quick on $hue_vlan inet proto udp from $hue_net to $iphone_net port 5353 keep state

# 7. Outbound Internet Access - Dual Stack

# Allow the router itself to access the internet (both protocols)
pass out on $wan_if from ($wan_if) to any

# Allow LAN clients to reach the WAN (IPv4 with NAT)
pass in on $lan_if inet from $lan_net to any
pass out on $wan_if inet from $lan_net to any

# Allow LAN clients to reach the WAN (IPv6 Forwarding - no NAT)
pass in on $lan_if inet6 from $lan_net6 to any
pass out on $wan_if inet6 from $lan_net6 to any

# Allow Xbox VLAN clients to reach the WAN (IPv4 with NAT) - explicit ports
pass in on $xbox_vlan inet from $xbox_net to any
pass out on $wan_if inet proto tcp from $xbox_net to any port 443 keep state
pass out on $wan_if inet proto tcp from $xbox_net to any port 3074 keep state
pass out on $wan_if inet proto udp from $xbox_net to any port 3074 keep state
pass out on $wan_if inet proto udp from $xbox_net to any port 3078 keep state
pass out on $wan_if inet proto udp from $xbox_net to any port 3079 keep state
pass out on $wan_if inet proto udp from $xbox_net to any port 123 keep state

# Allow Xbox VLAN clients to reach the WAN (IPv6 Forwarding - no NAT) - explicit ports
pass in on $xbox_vlan inet6 from $xbox_net6 to any
pass out on $wan_if inet6 proto tcp from $xbox_net6 to any port 443 keep state
pass out on $wan_if inet6 proto tcp from $xbox_net6 to any port 3074 keep state
pass out on $wan_if inet6 proto udp from $xbox_net6 to any port 3074 keep state
pass out on $wan_if inet6 proto udp from $xbox_net6 to any port 3078 keep state
pass out on $wan_if inet6 proto udp from $xbox_net6 to any port 3079 keep state
pass out on $wan_if inet6 proto udp from $xbox_net6 to any port 123 keep state

# Allow Hue VLAN clients to reach the WAN (IPv4 with NAT) - explicit ports
pass in on $hue_vlan inet from $hue_net to any
pass out on $wan_if inet proto tcp from $hue_net to any port 443 keep state
pass out on $wan_if inet proto udp from $hue_net to any port 123 keep state

# Allow Hue VLAN clients to reach the WAN (IPv6 Forwarding - no NAT) - explicit ports
pass in on $hue_vlan inet6 from $hue_net6 to any
pass out on $wan_if inet6 proto tcp from $hue_net6 to any port 443 keep state
pass out on $wan_if inet6 proto udp from $hue_net6 to any port 123 keep state